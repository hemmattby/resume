<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>رزومه تعاملی</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:Vazir;font-weight:300;font-display:swap;src:url(https://www.iranphana.com/hh/Vazir-Light.woff) format("woff")}
@font-face{font-family:Vazir;font-weight:500;font-display:swap;src:url(https://www.iranphana.com/hh/Vazir-Medium.woff) format("woff")}
@font-face{font-family:Vazir;font-weight:900;font-display:swap;src:url(https://www.iranphana.com/hh/Vazir-Black.woff) format("woff")}
:root{--ink:#050b22;--navy:#0a1740;--royal:#1b3b8f;--glow:#5f83ff;--ivory:#efe6cf;--gold:#c9a45c;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink);color:var(--ivory);
font-family:Vazir,Tahoma,"Segoe UI",sans-serif;font-weight:500;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
/* position:fixed + inset:0 follows the *visible* Safari viewport, so it works with or without fullscreen */
.layer{position:fixed;inset:0;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#bg{background:radial-gradient(120% 80% at 50% 0%,var(--royal) 0%,var(--navy) 42%,var(--ink) 100%)}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 100%,rgba(95,131,255,.12),transparent)}

/* ---------- loading ---------- */
#ld{z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--ink);transition:opacity .7s,visibility .7s}
#ld img{position:absolute;top:50%;left:50%;width:min(62vw,260px);height:auto;opacity:0;transform:translate(-50%,-50%) scale(.92);transition:opacity .9s,transform 1.2s cubic-bezier(.2,.8,.2,1),width 1.2s cubic-bezier(.2,.8,.2,1),filter 1.2s}
#ld.done img{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ld .bar{transition:opacity .4s}#ld.done .bar{opacity:0}
#ld .bar{width:min(46vw,190px);height:2px;background:rgba(239,230,207,.15);overflow:hidden;border-radius:2px}
#ld .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--ivory));transform-origin:right;transform:scaleX(0);transition:transform .35s ease-out}
#ld.off{opacity:0;visibility:hidden}

/* ---------- intro sky ---------- */
#sky{z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s,visibility 1s}
#sky.off{opacity:0;visibility:hidden}
.st{position:absolute;width:var(--s);height:var(--s);transition:opacity 1.6s,transform 1.8s cubic-bezier(.2,.7,.2,1)}
.st svg,#moon svg{width:100%;height:100%;overflow:visible}
.st path{fill:none;stroke:var(--ivory);stroke-width:1.1;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease-out var(--d)}
.s1 .st path{stroke-dashoffset:0}
.s1 .st{animation:tw 3.4s ease-in-out var(--d) infinite}
@keyframes tw{50%{opacity:.45}}
.s2 .st{opacity:.32;transform:scale(.7);animation:none}
#moon{position:relative;width:min(58vw,270px);aspect-ratio:1;margin-bottom:6px;transform:scale(.55);opacity:0;transition:transform 2.6s cubic-bezier(.2,.7,.2,1),opacity 1s;filter:drop-shadow(0 0 14px rgba(95,131,255,.55))}
#moon path{fill:none;stroke:var(--ivory);stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.3s ease-in-out}
.s2 #moon{opacity:1;transform:none}.s2 #moon path{stroke-dashoffset:0}
#slogan{max-width:min(86vw,420px);text-align:center;font-weight:900;font-size:clamp(19px,5.6vw,27px);line-height:2;padding:0 6px}
#slogan span{display:inline-block;opacity:0;transform:translateY(10px);filter:blur(6px);transition:opacity .8s,transform .8s,filter .8s;transition-delay:calc(var(--i)*90ms)}
#slogan em{font-style:normal;color:var(--gold)}
.s3 #slogan span{opacity:1;transform:none;filter:none}
#ask{width:min(88vw,380px);margin-top:26px;display:flex;flex-direction:column;gap:14px;opacity:0;transform:translateY(14px);visibility:hidden;transition:opacity .9s,transform .9s,visibility .9s}
.s4 #ask{opacity:1;transform:none;visibility:visible}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid rgba(239,230,207,.22);border-radius:14px;background:rgba(5,11,34,.35);font-size:15px}
.seg{display:flex;border:1px solid rgba(239,230,207,.3);border-radius:999px;padding:3px;direction:rtl}
.seg button{padding:7px 18px;border-radius:999px;font-size:14px;color:rgba(239,230,207,.7);transition:background .3s,color .3s}
.seg button[aria-pressed=true]{background:var(--ivory);color:var(--ink);font-weight:900}
#enter{margin-top:4px;padding:14px;border-radius:14px;border:1px solid var(--gold);color:var(--gold);font-weight:900;font-size:16px;transition:background .3s,color .3s}
#enter:active{background:var(--gold);color:var(--ink)}

/* ---------- app shell ---------- */
#app{z-index:10;visibility:hidden}
#app.on{visibility:visible}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 70% at 50% 30%,rgba(95,131,255,.07),transparent 72%)}
#stage{position:absolute;inset:calc(var(--sat) + 42px) var(--sar) calc(var(--sab) + 78px) var(--sal);overflow:hidden}
.pg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 20px;will-change:transform,opacity}
.pg::after{content:"";position:absolute;inset:12% 6% 8%;border:1px solid rgba(239,230,207,.035);border-radius:28px;pointer-events:none}
.pg h2{font-weight:900;font-size:clamp(24px,7vw,34px);margin-bottom:12px}
.pg p{opacity:.7;font-size:15px;line-height:2}
#nav{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 14px);display:flex;align-items:center;justify-content:center;gap:18px;padding:0 20px}
#nav button.n{width:52px;height:52px;border-radius:50%;border:1px solid rgba(239,230,207,.35);background:rgba(5,11,34,.5);display:grid;place-items:center;transition:opacity .3s,background .3s}
#nav button.n:active{background:rgba(239,230,207,.18)}
#nav button.n:disabled{opacity:.25}
#nav svg{width:20px;height:20px;fill:none;stroke:var(--ivory);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dots{display:flex;gap:7px;min-width:88px;justify-content:center}
#dots i{width:6px;height:6px;border-radius:50%;background:rgba(239,230,207,.28);transition:width .4s,background .4s}
#dots i.a{width:20px;border-radius:4px;background:var(--gold)}
/* settings */
#gear{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 10px);width:40px;height:40px;border-radius:13px;border:1px solid rgba(239,230,207,.22);background:rgba(5,11,34,.48);display:grid;place-items:center;z-index:8;box-shadow:0 10px 26px rgba(2,6,22,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#pageMeta{position:absolute;top:calc(var(--sat) + 10px);right:calc(var(--sar) + 12px);display:flex;align-items:center;gap:9px;z-index:7;pointer-events:none}
#pageMeta .pn{font-size:11px;letter-spacing:1.2px;direction:ltr;color:rgba(239,230,207,.58)}
#pageMeta .ps{padding:5px 10px;border:1px solid rgba(201,164,92,.24);border-radius:999px;background:rgba(5,11,34,.36);font-size:11.5px;color:rgba(239,230,207,.78);white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#pageProgress{position:absolute;top:calc(var(--sat) + 57px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);height:2px;border-radius:2px;background:rgba(239,230,207,.08);overflow:hidden;z-index:7;pointer-events:none}
#pageProgress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--ivory));box-shadow:0 0 10px rgba(201,164,92,.35);transition:width .6s cubic-bezier(.2,.8,.2,1)}
#gear svg{width:20px;height:20px;fill:none;stroke:var(--ivory);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#panel{position:absolute;top:calc(var(--sat) + 62px);left:calc(var(--sal) + 12px);width:min(84vw,300px);padding:12px;border-radius:18px;background:rgba(10,23,64,.94);border:1px solid rgba(239,230,207,.22);display:flex;flex-direction:column;gap:10px;z-index:5;opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top left;visibility:hidden;transition:opacity .3s,transform .3s,visibility .3s}
#panel.on{opacity:1;transform:none;visibility:visible}
#panel small{opacity:.6;font-size:12px;line-height:1.9;padding:0 4px}

.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:11px 14px;border:1px solid rgba(239,230,207,.22);border-radius:14px;background:rgba(5,11,34,.35);font-size:15px;text-align:right}
.tg i{position:relative;flex:none;width:42px;height:24px;border-radius:99px;background:rgba(239,230,207,.22);transition:background .3s}
.tg i::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--ivory);transition:transform .3s}
.tg[aria-pressed=true] i{background:var(--gold)}.tg[aria-pressed=true] i::after{transform:translateX(-18px)}
.pg{justify-content:flex-start;align-items:stretch;overflow-y:auto;text-align:right;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pg::-webkit-scrollbar{display:none}
.in{margin:auto;width:100%;max-width:460px;position:relative;z-index:1}
.pg h2{font-size:clamp(22px,6.4vw,30px);margin-bottom:14px}
.intro{display:flex;align-items:center;gap:20px;padding:20px;border:1px solid rgba(239,230,207,.13);border-radius:24px;background:linear-gradient(145deg,rgba(27,59,143,.18),rgba(5,11,34,.34));box-shadow:0 18px 45px rgba(2,6,22,.22),inset 0 1px 0 rgba(239,230,207,.04)}
.tb{flex:1;min-width:0}
.tb h1{font-weight:900;font-size:clamp(24px,7vw,32px);margin-bottom:16px}
.deg{margin-bottom:14px;font-size:15px;line-height:1.9}.deg small{display:block;opacity:.65;font-size:13px}
.hi{color:var(--gold);font-weight:900;font-size:16px;line-height:1.9;border-top:1px solid rgba(201,164,92,.4);padding-top:12px}
.pt{flex:none;width:min(34vw,150px);filter:drop-shadow(0 16px 28px rgba(2,6,22,.34))}.pt img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid rgba(201,164,92,.38)}
.tl{position:relative;padding-right:26px}
.ln{position:absolute;right:10px;top:8px;bottom:8px;width:1px;background:var(--gold);transform-origin:top}
.jb{position:relative;margin-bottom:20px;padding:13px 14px 14px;border:1px solid rgba(239,230,207,.10);border-radius:18px;background:linear-gradient(160deg,rgba(27,59,143,.10),rgba(5,11,34,.16))}.jb:last-child{margin-bottom:0}
.jb::before{content:"";position:absolute;right:-21px;top:9px;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--gold);background:var(--ink)}
.jb h3{font-weight:900;font-size:16px;line-height:1.7}.jb .co{color:var(--gold);font-size:14px}.jb .dt{opacity:.6;font-size:12.5px;margin-bottom:6px}
.jb ul{list-style:none;padding:0}.jb li{font-size:13.5px;line-height:1.85;opacity:.88;padding-right:14px;position:relative}
.jb li::before{content:"•";position:absolute;right:0;color:var(--gold)}
.cd{border:1px solid rgba(239,230,207,.14);border-radius:18px;padding:14px 16px;margin-bottom:12px;background:rgba(5,11,34,.34);box-shadow:0 12px 30px rgba(2,6,22,.15)}
.cd h3{font-weight:900;font-size:16px}
.cd a{display:inline-block;color:var(--gold);font-size:13.5px;margin:4px 0 8px;text-decoration:none;border-bottom:1px solid rgba(201,164,92,.5)}
.cd .sb{display:block;font-size:13.5px;opacity:.8;padding:4px 0}
.cd .sb::after{content:" ﹀";display:inline-block;transition:transform .3s}.cd.op .sb::after{transform:rotate(180deg)}
.cd .story{max-height:0;overflow:hidden;font-size:13.5px;line-height:1.9;opacity:.75;transition:max-height .5s ease}
.kws{display:flex;flex-direction:column;gap:6px}
.kw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border:1px solid rgba(239,230,207,.16);border-radius:12px;font-size:14px;background:rgba(5,11,34,.35)}
.kw b{flex:none;font-size:12px;color:var(--gold);border:1px solid rgba(201,164,92,.5);border-radius:99px;padding:2px 10px}
.sub{opacity:.65;font-size:13.5px;margin:-6px 0 14px}
.sk{margin-bottom:20px;position:relative}.sk div{display:flex;justify-content:space-between;font-size:15px;margin-bottom:7px}.sk b{color:var(--gold)}
.br{height:6px;border-radius:6px;background:rgba(239,230,207,.14);overflow:hidden}
.fill{height:100%;width:var(--w);border-radius:6px;background:linear-gradient(270deg,var(--gold),var(--ivory));transform-origin:right}
.bgt{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.17}
.mq{position:absolute;left:0;right:0;direction:ltr}
.mq div{display:flex;gap:30px;width:max-content;white-space:nowrap;font-size:14px;animation:mq var(--t) linear infinite;animation-direction:var(--r,normal)}
@keyframes mq{to{transform:translateX(-50%)}}


#nav{left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 10px);gap:8px;padding:7px 8px;border:1px solid rgba(239,230,207,.16);border-radius:22px;background:rgba(5,11,34,.62);box-shadow:0 14px 40px rgba(2,6,22,.34),inset 0 1px 0 rgba(239,230,207,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#nav button.n{width:auto;min-width:44px;height:40px;padding:0 14px;gap:7px;border-radius:14px;font-size:13px;border-color:rgba(239,230,207,.24);background:rgba(239,230,207,.035)}
#nav button.n:active{background:rgba(239,230,207,.13);transform:translateY(1px)}
#nav svg{width:15px;height:15px}#dots{min-width:0;gap:5px;padding:0 2px}#dots i.a{width:18px}
#ld.off,#sky.off,#sky.off *{pointer-events:none!important}
.pg h2,.sub{text-align:center}
.kw{margin-bottom:6px}
.kwv{height:min(58vh,470px);height:min(58dvh,470px);overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent)}
.kwt{animation:kwup 36s linear infinite}
@keyframes kwup{to{transform:translateY(-50%)}}

#ld{gap:0}
.lw{display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .5s}#ld.done .lw{opacity:0}
.ch{width:min(74vw,300px);height:auto;overflow:visible}
.ch .gr{stroke:rgba(239,230,207,.12);fill:none}
.ch rect{fill:rgba(239,230,207,.05);stroke:rgba(239,230,207,.28);stroke-width:1;transform-box:fill-box;transform-origin:50% 100%;animation:bx 1.7s ease-in-out infinite;animation-delay:calc(var(--k)*-.2s)}
@keyframes bx{50%{transform:scaleY(.4)}}
#trend{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 5px rgba(201,164,92,.7))}
#tip{fill:var(--ink);stroke:var(--gold);stroke-width:2}
.pc{font-weight:900;font-size:34px}.pc b{font-weight:900}
.wt{font-size:15px;font-weight:300;opacity:.85}
.dd i{display:inline-block;width:4px;height:4px;margin:0 2px;border-radius:50%;background:var(--gold);animation:dd 1.2s infinite}.dd i:nth-child(2){animation-delay:.15s}.dd i:nth-child(3){animation-delay:.3s}
@keyframes dd{0%,80%,100%{opacity:.2}40%{opacity:1}}
.kwc{font-size:12.5px;color:var(--gold);letter-spacing:1.5px;direction:ltr;height:18px;transition:opacity .25s}
#nav button.n{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;white-space:nowrap;width:auto;height:42px;padding:0 16px;gap:8px}
#nav button.n svg{flex:none}
.ar{flex:1;display:flex;justify-content:center;transition:opacity .3s}
.ar svg{width:40px;height:12px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:nd 1.4s ease-in-out infinite}
@keyframes nd{50%{transform:translateX(-7px)}}
#panel .ar{display:none}.tg[aria-pressed=true] .ar{opacity:0}
.jb li,.jb .dt,.deg small,.sub,.mq div,#sheet .sp{font-weight:300}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:9px;aspect-ratio:1/.78;padding:11px 12px;text-align:right;border:1px solid rgba(239,230,207,.15);border-radius:18px;background:linear-gradient(155deg,rgba(27,59,143,.24),rgba(5,11,34,.54));box-shadow:0 12px 28px rgba(2,6,22,.18),inset 0 1px 0 rgba(239,230,207,.045);transition:transform .25s,background .25s,border-color .25s}
.tile svg{width:64%;height:auto;fill:none;stroke:var(--ivory);stroke-width:1.2;stroke-linecap:round;opacity:.75}.tile svg .g{stroke:var(--gold)}
.tile b{font-weight:900;font-size:15px}.tile small{display:block;font-weight:300;opacity:.6;font-size:12.5px;margin-top:2px}
#sheet{position:absolute;inset:0;z-index:4;background:rgba(3,7,20,.6);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#sheet.on{opacity:1;visibility:visible}
.sh{position:absolute;left:0;right:0;bottom:0;padding:22px 24px 26px;border-radius:26px 26px 0 0;background:var(--navy);border-top:1px solid rgba(201,164,92,.55);transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#sheet.on .sh{transform:none}
.sh h3{font-weight:900;font-size:19px;margin-bottom:6px}.sh a{display:inline-block;color:var(--gold);font-size:14px;text-decoration:none;border-bottom:1px solid rgba(201,164,92,.5);margin-bottom:16px}
.sh h4{font-size:14px;opacity:.9;margin-bottom:6px}.sh p{font-size:14px;line-height:2;opacity:.8}
.sh .x{position:absolute;top:12px;left:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(239,230,207,.3);font-size:20px;line-height:1}

.lg{display:flex;align-items:center;justify-content:center;height:46px;padding:6px 10px;border-radius:11px;background:rgba(239,230,207,.93)}
.lg img{max-width:100%;max-height:100%;object-fit:contain}
.sl{display:inline-flex;height:46px;margin-bottom:12px}
.ob{margin-top:8px;text-align:center}
.osb{padding:8px 6px;color:var(--gold);font-size:14.5px;border-bottom:1px solid rgba(201,164,92,.5)}
.osb::after{content:" ﹀";display:inline-block;transition:transform .3s}.ob.op .osb::after{transform:rotate(180deg)}
.oth{max-height:0;overflow:hidden;text-align:right;transition:max-height .5s ease}
.oth h5{font-size:13px;color:var(--gold);margin:14px 0 4px}.oth p{font-weight:300;font-size:13.5px;line-height:2;opacity:.85}
.wig{animation:wg 2.6s ease-in-out infinite;border-color:var(--gold)!important;box-shadow:0 0 14px rgba(201,164,92,.35)}
@keyframes wg{0%,36%,100%{transform:none}4%{transform:translateX(-6px) rotate(-2.5deg)}9%{transform:translateX(6px) rotate(2.5deg)}14%{transform:translateX(-5px) rotate(-2deg)}19%{transform:translateX(5px) rotate(2deg)}24%{transform:translateX(-3px)}29%{transform:translateX(2px)}}

.cph{position:relative;width:min(68vw,36vh,290px);aspect-ratio:1;margin:6px auto 26px}
.cph::before{content:"";position:absolute;inset:-22%;background:radial-gradient(closest-side,rgba(95,131,255,.30),transparent 72%)}
.cph::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(201,164,92,.28);pointer-events:none}
.cph img{position:relative;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 18px 50px rgba(2,6,22,.6)}
.cnm{text-align:center;font-weight:900;font-size:21px;margin-bottom:22px}
.crl{text-align:center;font-weight:300;font-size:13.5px;opacity:.65;margin:4px 0 22px}
.cls{border-top:1px solid rgba(239,230,207,.12)}
.cn{display:flex;align-items:center;gap:14px;padding:15px 2px;color:inherit;text-decoration:none;border-bottom:1px solid rgba(239,230,207,.12)}
.ci{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,164,92,.3);display:grid;place-items:center;font-style:normal}

<script>

/* Each page: title, placeholder text, narration mp3 URL (placeholder = empty) and its own transition (TR key) */

const JOBS=[
 {r:"سرپرست و مدیر واحد دیجیتال مارکتینگ",c:"شرکت دانش‌بنیان فانا",d:"از ۱۴۰۰ تا ۱۴۰۵",b:["اصلاح استراتژی بازاریابی دیجیتال و افزایش ۵۰ درصدی نرخ ایجاد لید در یک سال","سئوی بیش از ۲۰۰ کلمه‌ی کلیدی برای سه وب‌سایت شرکت","چندزبانه‌سازی سایت‌ها و افزودن نسخه‌های انگلیسی، عربی، ترکی و روسی","توسعه نرم‌افزار گرافیکی کارگردانی نمایش‌های موزیکال آبنما","مدیریت پروژه‌ی سامانه هوشمند مدیریت آبنماهای شهری"]},

const SITES=["ایران‌فانا","نورفانا","پانا","عصاره بهشت"],URLS=["https://iranfana.com/","https://noorfana.com/","https://iranphana.com/","https://osarebehesht.com/"],STORY=["شرکت فانا، به‌عنوان یک مجموعه B2B، پس از چند تجربه ناموفق در همکاری با شرکت‌های طراحی سایت، تصمیم گرفت بار دیگر این مسیر را امتحان کند. با بازطراحی کامل سایت و اعمال اصلاحات ساختاری، روند بازدید سایت در مدت کوتاهی وارد مسیر صعودی شد و هم‌زمان نرخ ایجاد لید نیز افزایش چشمگیری پیدا کرد؛ به‌طوری‌که در سال‌های بعد، برخی از بزرگ‌ترین پروژه‌های شرکت از طریق لیدهای ایجادشده در وب‌سایت به دست آمدند.","پس از موفقیت پروژه فانا، این شرکت با هدف تقویت حضور خود در صنعت نورپردازی، بهینه‌سازی و سئوی وب‌سایت نورپردازی خود را نیز به ما سپرد. در کمتر از یک سال، یکی از بزرگ‌ترین پروژه‌های نورپردازی شرکت از همین مسیر و از طریق وب‌سایت رقم خورد.","شرکت پانا، فعال در زمینه تولید تجهیزات محوطه از جمله پروژکتورهای دفنی و استخری، برای بهینه‌سازی و سئوی وب‌سایت فروشگاهی خود با ما همکاری کرد. پیمانکار قبلی پروژه را نیمه‌تمام رها کرده بود و وب‌سایت در هیچ‌یک از کلمات کلیدی رقابتی جایگاه قابل‌توجهی نداشت. ارتقای سرعت سایت و بهبود سئوی داخلی و خارجی، بخشی از اقدامات انجام‌شده در این پروژه بود.","پس از یک تجربه ناموفق، مدیر این کسب‌وکار تصمیم گرفت بار دیگر به بازاریابی دیجیتال اعتماد کند. این وب‌سایت از پایه طراحی شده و در حال حاضر یکی از پروژه‌های در دست کار تیم ماست. در طراحی آن تلاش شد سلیقه و خواسته‌های ایشان، به‌ویژه تمرکز بر محصولات شاخص، به‌طور کامل در ساختار و تجربه کاربری سایت لحاظ شود."];
const KWR=d=>KW.map(([k,r])=>`<div class="kw${d?" d":""}"><bdi>${k}</bdi><b>${r?"رتبه "+fa(r):"صفحه "+fa(1)}</b></div>`).join("");
const KW=[["آبنمای موزیکال",1],["آبنمای کف خشک",1],["پروژکتور دفنی",1],["شرکت نورپردازی",1],["نورپردازی درخت",0],["طراحی آبنما",1],["نازل کرتین",1],["مشاوره کنکور ارشد برق",0],["مشاوره کنکور برق",0],["کوادکوپتر اصفهان",0],["خرید هلی شات اصفهان",0],["musical fountain iran",1],["نافورة موسيقية",2],["آبنمای ایران مال",1],["پروژکتور ضد آب توکار",2]];

 ["ویراستاری","ترجمه انگلیسی","نگارش","فتوشاپ","پریمیر","کپ‌کات (CapCut)","اینشات (InShot)","آفیس (Office)"],
 ["میکس و مسترینگ صدا","موزیک پروداکشن","FL Studio"]];
const mq=(g,i)=>{const t=g.map(x=>`<span dir="rtl">${x}</span>`).join("");return `<div class="mq" style="top:${[8,32,62,86][i]}%;--t:${[46,52,40,34][i]}s;--r:${i%2?"reverse":"normal"}"><div>${t}${t}${t}${t}</div></div>`};

const OB=`<div class="ob"><button class="osb">سایر مهارت‌ها</button><div class="oth">${BG.map((g,i)=>`<h5>${BGN[i]}</h5><p>${g.join(" • ")}</p>`).join("")}</div></div>`;
/* Each page: title, html, transition key, narration mp3 URL (empty = placeholder), say = narration text to record */
const PAGES=[
  // After uploading MP3 files, place each URL in the page's n field.
 {t:"معرفی",fx:"intro",n:"https://www.iranphana.com/hh/intro.mp3",say:"در این رزومه، خلاصه‌ای از مسیر حرفه‌ای، تجربه‌ها، پروژه‌ها و مهارت‌های من در حوزه بازاریابی دیجیتال، سئو و توسعه وب را می‌بینید. تمرکز اصلی من، تبدیل ابزارهای دیجیتال به نتیجه واقعی برای کسب‌وکار است.",h:`<div class="in intro"><div class="tb"><h1 class="t">${NAME}</h1>

 {t:"سوابق کاری",fx:"exp",n:"",say:"مسیر حرفه‌ای من از تولید محتوا و سئو شروع شد و به مدیریت دیجیتال مارکتینگ، توسعه نرم‌افزار و مدیریت پروژه رسید. در سال‌های اخیر، بخش مهمی از فعالیت من در فانا، روی بازاریابی دیجیتال، توسعه حضور آنلاین و پروژه‌های نرم‌افزاری متمرکز بوده است.",h:`<div class="in"><h2 class="h">سوابق کاری</h2><div class="tl"><i class="ln"></i>${[...JOBS,OTH].map(j=>`<div class="jb"><h3>${j.r}</h3>${j.c?`<div class="co">${j.c}</div><div class="dt">${j.d}</div>`:""}<ul>${j.b.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></div>`},

 {t:"مهارت‌ها",fx:"skills",n:"",say:"ادعا نمی‌کنم بهترین متخصص هر کدام از این حوزه‌ها هستم؛ مزیت اصلی من، ترکیب مهارت‌هاست. از استراتژی و سئو و تبلیغات تا طراحی سایت، تحلیل داده و تولید محتوا، هدفم این است که اجزای مختلف بازاریابی دیجیتال در یک مسیر واحد برای رشد برند قرار بگیرند.",h:`<div class="bgt">${BG.map(mq).join("")}</div><div class="in"><h2 class="h">مهارت‌ها</h2>${SK.map(([n,v])=>`<div class="sk"><div><span>${n}</span><b>${fa(v)}٪</b></div><div class="br"><i class="fill" style="--w:${v}%;display:block"></i></div></div>`).join("")}${OB}</div>`},

   <a class="cn" href="tel:+989130129755"><i class="ci"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></i><span class="cx"><small>شماره تماس</small><b>09130129755</b></span><svg class="go" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>

/* ===== Transition system =====
   Every transition = {in(el,o), out(el,o)} returning Web Animations.

 intro:{in:(e,o)=>[box(e,1500,o,1),...st(e,".pt",[{opacity:0,clipPath:"inset(100% 0 0 0)"},{opacity:1,clipPath:"inset(0)"}],1000,0,o,0,1500),...st(e,".t",[{opacity:0,transform:"translateX(26px)"},{opacity:1,transform:"none"}],650,110,o,350,1500)],
        out:(e,o)=>[box(e,1500,o),...st(e,".t",[{opacity:1,transform:"none",filter:"blur(0)"},{opacity:0,transform:"translateX(-34px)",filter:"blur(6px)"}],450,120,o,0,1500),...st(e,".tb",[{transform:"none"},{transform:"translateX(70px)"}],700,0,o,350,1500),...st(e,".pt",[{opacity:1,clipPath:"inset(0)",transform:"none"},{opacity:0,clipPath:"inset(0 0 100% 0)",transform:"scale(1.08)"}],850,0,o,500,1500)]},

        ...st(e,".h",[{opacity:0,transform:"translateY(-16px)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0)"}],650,0,o,900,2400),

        ...st(e,".jb",[{opacity:0,transform:"translateX(44px) scale(.96)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0)"}],650,280,o,900,2400)],

 work:{in:(e,o)=>[box(e,2000,o,1),...HI(e,o,2000,500),
        ...st(e,".tile:nth-child(odd)",[{opacity:0,transform:"perspective(700px) rotateY(-65deg) translateY(30px) scale(.9)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0)"}],800,280,o,700,2000),
        ...st(e,".tile:nth-child(even)",[{opacity:0,transform:"perspective(700px) rotateY(65deg) translateY(30px) scale(.9)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0)"}],800,280,o,840,2000)],
       out:(e,o)=>[box(e,1000,o),...HO(e,o,1000,0),...st(e,".tile",[{opacity:1,transform:"none"},{opacity:0,transform:"scale(.9)"}],400,90,o,150,1000)]},
 seo:{in:(e,o)=>[box(e,1600,o,1),...HI(e,o,1600,0),...st(e,".kw:not(.d)",[{opacity:0,clipPath:"inset(0 0 0 100%)"},{opacity:1,clipPath:"inset(0)"}],420,55,o,100,1600)],

 contact:{in:(e,o)=>[box(e,1900,o,1),...HI(e,o,1900,0),...st(e,".cph",[{opacity:0,transform:"scale(.82)",filter:"blur(10px)"},{opacity:1,transform:"none",filter:"blur(0)"}],900,0,o,150,1900),...st(e,".cnm,.crl",FU,600,90,o,550,1900),...st(e,".cn",FU,800,200,o,750,1900)],

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const stage=$("#stage"),dots=$("#dots"),sheet=$("#sheet");
let cur=-1,busy=false,wt=null;const nx=$("#next");
PAGES.forEach((p,i)=>{
 const d=document.createElement("section");d.className="pg";d.id="pg"+i;
 d.innerHTML=p.h;
 stage.appendChild(d);dots.appendChild(document.createElement("i"));
});
async function go(to,back=false){
 if(busy||to<0||to>=PAGES.length||to===cur)return;busy=true;sheet.classList.remove("on");clearTimeout(wt);nx.classList.remove("wig");
 const nw=$("#pg"+to),old=cur>=0?$("#pg"+cur):null;
 // forward uses target's "in" + old's "out"; backward runs the moving page's own transition reversed
 const fIn=TR[PAGES[to].fx],fOut=old&&TR[PAGES[cur].fx];
 const o={dir:back?"reverse":"normal"};
 nw.style.display="flex";
 const anims=[...fIn.in(nw,o)];
 if(old)anims.push(...fOut.out(old,o));
 if(back&&old){ // reverse: old page (the later one) un-enters, target un-leaves
  anims.forEach(a=>a.cancel());anims.length=0;
  anims.push(...TR[PAGES[cur].fx].in(old,o),...TR[PAGES[to].fx].out(nw,o));
 }
 cur=to;$$("#dots i").forEach((x,i)=>x.classList.toggle("a",i===to));
 $("#prev").disabled=to===0;$("#next").disabled=to===PAGES.length-1;
 $("#sectionName").textContent=PAGES[to].t;
 $("#pageNo").textContent=fa(to+1)+" / "+fa(PAGES.length);
 $("#pageProgress i").style.width=((to+1)/PAGES.length*100)+"%";
 playNarr(to);
 await Promise.all(anims.map(a=>a.finished.catch(()=>{})));
 anims.forEach(a=>a.cancel());
 $$(".pg").forEach((p,i)=>{p.style.display=i===to?"flex":"none"});
 busy=false;
 wt=setTimeout(()=>{if(cur<PAGES.length-1)nx.classList.add("wig")},3500);
}
$("#next").onclick=()=>go(cur+1);
$("#prev").onclick=()=>go(cur-1,true);
stage.addEventListener("click",e=>{const ob=e.target.closest(".osb");
 if(ob){const c=ob.parentNode,p=c.querySelector(".oth");c.classList.toggle("op");p.style.maxHeight=c.classList.contains("op")?p.scrollHeight+"px":0;setTimeout(()=>p.scrollIntoView({behavior:"smooth",block:"nearest"}),520);return}
 const t=e.target.closest(".tile");
 if(t){const i=+t.dataset.i;sheet.querySelector("h3").textContent=SITES[i];sheet.querySelector(".sl img").src=LOGOS[i];sheet.querySelector("a").href=URLS[i];sheet.querySelector(".sp").textContent=STORY[i];sheet.classList.add("on")}
 else if(e.target===sheet||e.target.closest(".x"))sheet.classList.remove("on")});
let sx=0,sy=0;
addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(cur<0||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.4)return;dx>0?go(cur+1):go(cur-1,true)},{passive:true});

/* ===== Audio ===== */
const S={music:0,voice:0};
const LB={music:["موسیقی را روشن کنید","موسیقی روشن است"],voice:["صدای گوینده را روشن کنید","صدای گوینده روشن است"]};
const music=new Audio(MUSIC_URL);music.loop=true;music.volume=.2;music.preload="none";
let narr=null;
const VM=.2,VD=.09;let vt=null;
function fade(to){clearInterval(vt);vt=setInterval(()=>{const d=to-music.volume;if(Math.abs(d)<.008){music.volume=to;clearInterval(vt)}else music.volume=Math.min(1,Math.max(0,music.volume+d*.15))},50)}
function stopNarr(){if(narr){narr.pause();narr=null}fade(VM)}
function playNarr(i){
 stopNarr();
 if(S.voice&&PAGES[i]&&PAGES[i].n){const a=new Audio(PAGES[i].n);narr=a;a.onended=()=>{if(narr===a){narr=null;fade(VM)}};a.play().then(()=>fade(VD)).catch(()=>{})}
}
function setOpt(k,v){
 S[k]=v;
 $$('.tg[data-k="'+k+'"]').forEach(b=>{b.setAttribute("aria-pressed",String(!!v));b.firstChild.textContent=LB[k][v]});
 if(k==="music")v?music.play().catch(()=>{}):music.pause();
 if(k==="voice"){v?playNarr(cur):stopNarr()}
}
$$(".tg").forEach(b=>{b.innerHTML="<span></span><em class=ar><svg viewBox='0 0 40 12'><path d='M38 6H4M9 1L4 6l5 5'/></svg></em><i></i>";b.onclick=()=>setOpt(b.dataset.k,S[b.dataset.k]?0:1)});
setOpt("music",0);setOpt("voice",0);

addEventListener("click",e=>{if(!e.target.closest("#panel")&&!e.target.closest("#gear"))$("#panel").classList.remove("on")});

else {

[[14,16,26],[78,10,18],[88,34,30],[8,46,16],[24,74,22],[70,80,28],[92,68,16],[46,7,14],[60,92,18],[36,90,14]].forEach(([x,y,s],i)=>{

/* ===== Loading: Safari-safe loader ===== */
(function load(){
  const ld=$("#ld"),logo=$("#ld img"),tr=$("#trend"),tip=$("#tip"),pc=$("#pct"),kc=$("#kwc");
  const LOGO="https://www.iranphana.com/hh/Logo.png";
  const raf=window.requestAnimationFrame||function(fn){return setTimeout(fn,16)};
  let L=300;
  try{if(tr&&typeof tr.getTotalLength==="function")L=tr.getTotalLength()||300}catch(e){}
  let target=.03,shown=0;
  function draw(p){
    try{tr.style.strokeDashoffset=String(1-p)}catch(e){}
    try{if(tr&&tip&&typeof tr.getPointAtLength==="function"){const q=tr.getPointAtLength(L*p);tip.setAttribute("cx",q.x);tip.setAttribute("cy",q.y)}}catch(e){}
    try{pc.textContent=fa(Math.round(p*100))}catch(e){pc.textContent=Math.round(p*100)+"%"}
  }
  (function tick(){
    shown+=(target-shown)*.12;
    if(Math.abs(target-shown)<.003)shown=target;
    draw(shown);
    if(!ld.classList.contains("done"))raf(tick);
  })();
  const W=["SEO","Google Ads","Analytics","Content","Conversion"];
  let wi=0;kc.textContent=W[0];
  const kt=setInterval(function(){
    kc.style.opacity="0";
    setTimeout(function(){wi=(wi+1)%W.length;kc.textContent=W[wi];kc.style.opacity="1"},180);
  },1000);
  const resources=[LOGO,PORTRAIT,CPHOTO,...new Set(LOGOS)];
  let done=0;const total=resources.length;
  function loadImage(url){
    return new Promise(function(resolve){
      let finished=false;
      function finish(){if(finished)return;finished=true;resolve()}
      const img=new Image();
      img.onload=finish;img.onerror=finish;
      try{img.src=url}catch(e){finish();return}
      setTimeout(finish,5000);
    });
  }
  function loadFontSafely(font){
    try{
      if(document.fonts&&typeof document.fonts.load==="function"){
        return Promise.race([
          Promise.resolve().then(function(){return document.fonts.load(font)}).catch(function(){}),
          new Promise(function(resolve){setTimeout(resolve,2000)})
        ]);
      }
    }catch(e){}
    return Promise.resolve();
  }
  function mark(promise){
    return Promise.resolve(promise).catch(function(){}).then(function(){
      done++;
      target=Math.min(.94,Math.max(target,(done/Math.max(1,total))*.94));
    });
  }
  function wait(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
  Promise.all(resources.map(function(url){return mark(loadImage(url))}))
    .then(function(){return loadFontSafely("300 16px Vazir")})
    .then(function(){return loadFontSafely("500 16px Vazir")})
    .then(function(){return loadFontSafely("900 16px Vazir")})
    .then(function(){target=1;return wait(500)})
    .then(function(){
      try{logo.src=LOGO}catch(e){}
      const brand=$("#brandLogo");
      try{brand.src=LOGO}catch(e){}
      const waits=[];
      try{if(logo&&typeof logo.decode==="function")waits.push(Promise.resolve(logo.decode()).catch(function(){}))}catch(e){}
      try{if(brand&&typeof brand.decode==="function")waits.push(Promise.resolve(brand.decode()).catch(function(){}))}catch(e){}
      return Promise.race([Promise.all(waits),wait(1200)]);
    })
    .then(function(){ld.classList.add("done");clearInterval(kt);return wait(650)})
    .then(function(){
      const brand=document.getElementById("brandHeader");
      const brandImg=document.getElementById("brandLogo");
      if(!brand||!brandImg||!logo)return;
      brandImg.style.opacity="0";
      brand.classList.add("on");
      const from=logo.getBoundingClientRect(),to=brandImg.getBoundingClientRect();
      const dx=(to.left+to.width/2)-(from.left+from.width/2);
      const dy=(to.top+to.height/2)-(from.top+from.height/2);
      const scale=Math.min(1,to.width/Math.max(1,from.width));
      if(typeof logo.animate==="function"){
        try{
          const move=logo.animate([
            {transform:"translate(-50%,-50%) scale(1)"},
            {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${scale})`}
          ],{duration:1050,easing:"cubic-bezier(.2,.8,.2,1)",fill:"forwards"});
          return Promise.race([Promise.resolve(move.finished).catch(function(){}),wait(1300)]);
        }catch(e){}
      }
      try{
        logo.style.transition="transform 1050ms cubic-bezier(.2,.8,.2,1)";
        raf(function(){logo.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${scale})`});
      }catch(e){}
      return wait(1100);
    })
    .then(function(){
      try{logo.style.opacity="0"}catch(e){}
      try{$("#brandLogo").style.opacity=".84"}catch(e){}
      ld.classList.add("off");
      return wait(150);
    })
    .then(function(){startIntro()})
    .catch(function(){
      clearInterval(kt);target=1;
      setTimeout(function(){
        try{ld.classList.add("done")}catch(e){}
        try{ld.classList.add("off")}catch(e){}
        try{startIntro()}catch(e){}
      },500);
    });
})();
